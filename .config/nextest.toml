# cargo-nextest profiles for fs-interfaces (workflow testlauf, CLAUDE.md §4: little but often). Vorlage fs-components 216594c0.
# Geprüft mit `cargo nextest list` (C4 Batch 1), nicht ausgeführt.
# Namenskonvention wie im Muster; Zuordnung nur nach Dateiname (Binary = <paket>::<datei>, Paket = Verzeichnis angenommen).
# Nur Stufen, zu denen das Repo Treffer hat; binary(...) nur mit nachgewiesenem Treffer (nextest verweigert leere Mengen).
# Stufen: quick (Unit/Modell) | security (ganz fs-mcp + restricted/security, additiv: quick enthält sie weiter) | release (nur CI, alles).

[profile.default]
fail-fast = false

[profile.quick]
default-filter = "not (binary(/hardening|canary_|secrets|sensitive/) | test(/restricted|security/))"
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

# Security: the whole fs-mcp package (MCP "nur Mensch": real_admin, real_contracts, real_free, rules, exclusions, review2-4, tool_release*, hardening, canary_*, secrets, sensitive) plus any test named restricted|security (CLAUDE.md §4 hard limit 2). Additive: quick unchanged (still excludes only the old name set); full run before the release.
[profile.security]
default-filter = "binary_id(/^fs-mcp(::|$)/) | binary(/hardening|canary_|secrets|sensitive/) | test(/restricted|security/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.release]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
