# cargo-nextest-Profile für fs-interfaces (Workflow testlauf, CLAUDE.md §4: wenig, aber oft).
# Geprüft mit `cargo nextest list` (C3, 25.11.): quick 98, release 98 Tests; nicht ausgeführt.
# Es gibt nur Stufen, zu denen das Repo Treffer hat. Stufe security fehlt bewusst: fs-interfaces hat kein Paket fs-mcp
# und keine Tests mit hardening, canary, secrets, sensitive, restricted oder security im Namen (nextest list: 0 Treffer;
# nextest verweigert leere Mengen). Kommt ein solcher Test dazu, wird die Stufe security nach Vorlage fs-components ergänzt.
# Stufen: quick (alles, was das Repo hat) | release (nur CI, alles).

[profile.default]
fail-fast = false

[profile.quick]
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.release]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
