# cargo-nextest profiles for fs-interfaces (workflow testlauf, CLAUDE.md §4: little but often). Vorlage fs-components 216594c0.
# Geprüft mit `cargo nextest list` (C4 Batch 1), nicht ausgeführt.
# Namenskonvention wie im Muster; Zuordnung nur nach Dateiname (Binary = <paket>::<datei>, Paket = Verzeichnis angenommen).
# Nur Stufen, zu denen das Repo Treffer hat; binary(...) nur mit nachgewiesenem Treffer (nextest verweigert leere Mengen).
# Stufen: quick (Unit/Modell) | time (--stress-count 10) | socket | security | platform | picture | release (nur CI).

[profile.default]
fail-fast = false

[profile.quick]
default-filter = "not (binary(/hardening|canary_|secrets|sensitive/) | test(/restricted|security/))"
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

# Security (fs-mcp, MCP "nur Mensch"; CLAUDE.md §4 harte Grenze 2): Dateinamen hardening*, canary_*, *secrets*, *sensitive*. Voller Lauf vor dem Release.
[profile.security]
default-filter = "binary(/hardening|canary_|secrets|sensitive/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.release]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
