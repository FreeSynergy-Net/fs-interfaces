[package]
name = "fs-mcp"
description = "MCP tool generator (stage 1): reads the Cap'n Proto contracts and lists tools and resource templates with risk classes; no server, no execution (ADR 0021, 0054)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# The generated command code and tool tables and the server on them, with everything they need (the contracts, capnp-rpc, futures, the basic types). `regenerate` builds fs-mcp without it (default-features = false), so it never builds the crate whose files it writes.
default = ["generated"]
generated = ["dep:fs-interfaces", "dep:capnp-rpc", "dep:futures", "dep:fs-types"]
# The canary test (markers and the search for them); in no default, it is a conformance tool, not part of a program.
conformance = []

[dependencies]
capnp = "0.27"
# Our own pure-Rust schema compiler (ADR 0040), by the Git rev f600c8ee of fs-capnpc main (0.2.3, enum fallback landed; stays on the rev until a tag v0.2.x exists, then switch to the tag).
capnp-compiler = { git = "https://github.com/FreeSynergy/fs-capnpc", rev = "f600c8ee25b234b83b36fa6bfb8baa46b2eeb45f", default-features = false }
serde_json = "1"
toml = "0.8"
# The basic types (ADR 0093): their schema directory is an import path of the contracts.
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", version = "0.0.7", rev = "722d3ce0156711d40cb278f2e835e865d9448290", optional = true }
# The generated command code (`src/generated/tasks_cli.rs`) names the contracts of this repository and starts listeners.
fs-interfaces = { path = "../fs-interfaces", version = "0.2.0", optional = true }
capnp-rpc = { version = "0.27", optional = true }
# The server (stage 2) runs the calls of a line to the end on a local pool.
futures = { version = "0.3", optional = true }

[dev-dependencies]
# The answers of the tools are checked against the schemas of the table (tests only); no network, no resolvers.
jsonschema = { version = "0.61", default-features = false }
