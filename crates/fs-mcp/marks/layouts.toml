# Risk marks for layouts.capnp (DRAFT 0.1, owner fs-forms; stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.
# Frontend descriptions, overlays and locks are engine business of fs-forms: every program reaches them through the one fs-forms
# process, an agent never edits a frontend description or a lock directly (administration, ADR 0056). All interfaces are excluded
# (safe preset); what could be offered later (reading a description) is decided per right in fs-access (preset: off).

[Layouts]
"@interface" = { risk = "excluded", reason = "frontend descriptions, overlays, conflicts and the repair of the store: engine only, written through the one fs-forms process (ADR 0096)" }

[LayoutAdmin]
"@interface" = { risk = "excluded", reason = "locks on frontend descriptions and instance overlays: administration (ADR 0056)" }
