# Risk marks for types.capnp (stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.
# `describe` only reports what a program can do (names, basic types, labels); it reads no object and no secret.

[TypeCatalog]
describe = "read"

[format]
"NameComponent.value" = "one part of a person's name (given name, surname ...); display text of the kind in `kind`, not a secret field"
"AddressComponent.value" = "one part of a postal address (street, locality, postcode ...); display text of the kind in `kind`, not a secret field"

# Written release (rule: safe first, a human releases one tool at a time; delete the entry to revoke).
# `tasks.types.describe`: the label hits ("translation key") are gone since the comment rule R1 (a key right behind
# `translation`, `label`, `sort`, `primary`, `foreign`, `cache` is no key material); this hit is left.
[[tool_release]]
tool = "TypeCatalog.describe"
reason = "false alarm: the comment of `FieldDescription.choices` says 'the allowed keys' of a choice field: the values a person may pick (labels of the language files), no key material"
source = "fs-types types.capnp:91 (FieldDescription.choices)"
paths = ["types/FieldDescription.choices"]
