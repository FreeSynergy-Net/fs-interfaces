[package]
name = "regenerate"
description = "Regenerates the committed Rust code of fs-interfaces from schema/ with our own compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Our own pure-Rust schema compiler (ADR 0040), by the Git rev a95a2a15 of fs-capnpc (enum fallback; PROVISIONAL, switch back to the tag once fs-capnpc has landed and been tagged).
capnp-compiler = { git = "https://github.com/FreeSynergy/fs-capnpc", rev = "a95a2a1571366ea4dc4f086f36929d69e7b6a52a", default-features = false }
capnpc = "0.27"
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.6" }
# The marks of the program (an adapter of `MarkSource`) for the command code and the tool tables.
fs-mcp = { path = "../fs-mcp", default-features = false }
