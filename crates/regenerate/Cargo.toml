[package]
name = "regenerate"
description = "Regenerates the committed Rust code of fs-interfaces from schema/ with our own compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Our own pure-Rust schema compiler (ADR 0040), from crates.io (tag v0.2.0 of fs-capnpc).
capnp-compiler = { version = "0.2.0", default-features = false }
capnpc = "0.27"
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.4" }
# The marks of the program (an adapter of `MarkSource`) for the command code and the tool tables.
fs-mcp = { path = "../fs-mcp" }
