[package]
name = "fs-groups-testdata"
description = "Test providers, conformance rules and fixed sample data of FreeSynergy groups: a fake of the locked Groups trait (groups_v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
# Same fs-types tag as fs-interfaces and fs-person-directory.
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.4" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
