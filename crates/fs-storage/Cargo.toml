[package]
name = "fs-storage"
description = "The contract `storage` of FreeSynergy (one tree of everything a person may reach): the trait `StorageProvider`, a fake with a sample tree and conformance rules. Replaces `files.capnp` (ADR 0070)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
# Same pin as the rest of this workspace, so the lock holds ONE fs-types (`FileRef` with sha256, `PersonRef`).
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.4" }
sha2 = "0.10"
# Bytes live in the existing content-addressed port (v5 `FileStore`, `MemoryFiles`; `urn:sha256:` references), not in an own store.
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.8", features = ["v5"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
