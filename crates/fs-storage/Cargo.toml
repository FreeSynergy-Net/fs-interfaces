[package]
name = "fs-storage"
description = "The contract `storage` of FreeSynergy (one tree of everything a person may reach): the trait `StorageProvider`, a fake with a sample tree and conformance rules. Replaces `files.capnp` (ADR 0070)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
# Same pin as the rest of this workspace, so the lock holds ONE fs-types (`FileRef` with sha256, `PersonRef`).
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290" }
sha2 = { version = "0.10", optional = true }

[features]
# The fake, its sample tree and the conformance rules (need sha256 to build `FileRef`s). Off by default: the contract
# itself (trait and types) pulls in only fs-types and async-trait, and no database ever.
fake = ["dep:sha2"]

[[test]]
name = "conformance"
required-features = ["fake"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
