[package]
name = "fs-module"
description = "The contract `module_v1` of FreeSynergy (a module serves FormSource level 1: hello, page, blob, invoke): the fixture trait, a fake source and the conformance rules"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The rule "watch sees the change within 1 s" waits with a timer (the host and the tests run on tokio anyway).
tokio = { version = "1", features = ["time"] }
capnp = "0.27"
# Same crate as the rest of this workspace; NO fs-rpc here (it depends on fs-interfaces itself: two sources in the lock).
fs-interfaces = { path = "../fs-interfaces", version = "0.2.0" }
capnp-rpc = "0.27"
# Art `time` is read as the shared type `DateTime` (strict RFC 3339); the same pin as fs-interfaces, ONE fs-types in the lock.
# Zone names (rule 22, `time-zone`): the same fs-jscalendar pin as fs-events; no zone parser of our own.
fs-jscalendar = { git = "https://github.com/FreeSynergy-Net/fs-jscalendar", version = "0.0.7", rev = "0a3add97339c92be0ab8b524a294ca44ee8dca25" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", version = "0.0.7", rev = "722d3ce0156711d40cb278f2e835e865d9448290" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# `owner::fake::person` builds the person of a test context.
fs-interfaces = { path = "../fs-interfaces", version = "0.2.0", features = ["fake"] }
