[package]
name = "fs-interfaces"
description = "FreeSynergy interface contracts: Cap'n Proto schemas (one owner per topic, draft until 1.0) with committed generated Rust, and the shared provider rule (Unsupported, Capabilities)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
capnp = "0.27"
# The basic types (ADR 0093): the generated code points at `::fs_types::types_capnp`. No re-export from here.
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.4" }

[dev-dependencies]
# Our own pure-Rust schema compiler (ADR 0040) regenerates the committed code ...
# Pinned by commit of fs-capnpc main (MCP generator M1/M2, no tag yet). After the tag v0.2.0: switch to `tag = "v0.2.0"` (own commit).
capnp-compiler = { git = "https://github.com/FreeSynergy/fs-capnpc", rev = "81425e23d8e9dbef77b895864add55f7c2c46c5c", default-features = false }
capnpc = "0.27"
# ... and the official compiler (as WASM) is the oracle in tests/generated_matches_official.rs.
capnpc-embedded = "0.2"
