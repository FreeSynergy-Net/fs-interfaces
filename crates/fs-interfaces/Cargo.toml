[package]
name = "fs-interfaces"
description = "FreeSynergy interface contracts: Cap'n Proto schemas (one owner per topic, draft until 1.0) with committed generated Rust, and the shared provider rule (Unsupported, Capabilities)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
capnp = "0.27"
# Versions of forms: SemVer, read directly with the crate (ENTSCHEID-schnitt V-2, no adapter).
semver = "1.0.28"
# The basic types (ADR 0093): the generated code points at `::fs_types::types_capnp`. No re-export from here.
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.4" }

[dev-dependencies]
# Our own pure-Rust schema compiler (ADR 0040), by the Git tag v0.2.2 of fs-capnpc (the tag is the one reviewed state; crates.io is the owner's upload).
capnp-compiler = { git = "https://github.com/FreeSynergy/fs-capnpc", tag = "v0.2.2", default-features = false }
capnpc = "0.27"
# ... and the official compiler (as WASM) is the oracle in tests/generated_matches_official.rs.
capnpc-embedded = "0.2"
