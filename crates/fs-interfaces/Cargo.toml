[package]
name = "fs-interfaces"
description = "FreeSynergy interface contracts: Cap'n Proto schemas (one owner per topic, draft until 1.0) with committed generated Rust, and the shared provider rule (Unsupported, Capabilities)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
capnp = "0.27"
# Versions of forms: SemVer, read directly with the crate (ENTSCHEID-schnitt V-2, no adapter).
semver = "1.0.28"
# The basic types (ADR 0093): the generated code points at `::fs_types::types_capnp`. No re-export from here.
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.6" }

[dev-dependencies]
# Our own pure-Rust schema compiler (ADR 0040), by the Git rev a95a2a15 of fs-capnpc (enum fallback; PROVISIONAL, switch back to the tag once fs-capnpc has landed and been tagged).
capnp-compiler = { git = "https://github.com/FreeSynergy/fs-capnpc", rev = "a95a2a1571366ea4dc4f086f36929d69e7b6a52a", default-features = false }
capnpc = "0.27"
# ... and the official compiler (as WASM) is the oracle in tests/generated_matches_official.rs.
capnpc-embedded = "0.2"
